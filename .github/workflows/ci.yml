name: Validar Kotlin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar compilador Kotlin 2.1.0
        run: |
          curl --fail --location --retry 2 -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          echo 'b6698d5728ad8f9edcdd01617d638073191d8a03139cc538a391b4e3759ad297  kotlin.zip' | sha256sum --check --strict
          unzip -q kotlin.zip -d /tmp/kotlin-tools
          /tmp/kotlin-tools/kotlinc/bin/kotlinc Main.kt Deck.kt DeckCli.kt DeckTests.kt -include-runtime -d app.jar
      - name: Testar algoritmo original e novo baralho
        run: java -jar app.jar --self-test

      - name: Verificar comandos de estudo
        run: |
          java -jar app.jar --deck "$RUNNER_TEMP/cards.tsv" add card-1 "O que é API?" "Interface de Programação" 2026-11-08
          java -jar app.jar --deck "$RUNNER_TEMP/cards.tsv" due 2026-11-08 | grep -q "card-1"
          java -jar app.jar --deck "$RUNNER_TEMP/cards.tsv" review card-1 5 2026-11-08
          java -jar app.jar --deck "$RUNNER_TEMP/cards.tsv" stats 2026-11-09 | grep -q "Cartões: 1"
      - name: Testar CLI e compatibilidade
        run: |
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(["java","-jar","app.jar","--simular","2026-01-01","5,5,0,5"],capture_output=True,text=True)
          assert result.returncode == 0, result.stderr
          rows = [row.split("\t") for row in result.stdout.splitlines()]
          assert len(rows) == 5
          assert [row[2] for row in rows[1:]] == ["2026-01-02","2026-01-08","2026-01-09","2026-01-10"]
          assert [row[4] for row in rows[1:]] == ["1","2","0","1"]
          legacy = subprocess.run(["java","-jar","app.jar","2026-01-01","5","0","0","2.5"],capture_output=True,text=True)
          assert legacy.returncode == 0 and "proxima=2026-01-02" in legacy.stdout
          bad = subprocess.run(["java","-jar","app.jar","--simular","2026-01-01","5,6"],capture_output=True,text=True)
          assert bad.returncode == 2 and not bad.stdout
          print("3 cenários CLI OK")
          PY
